name: Deploy member API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret yet, skipping"; exit 0; fi
          if grep -q 'KV_ID\|ACCOUNT_ID' worker/wrangler.toml; then echo "wrangler.toml not filled yet, skipping"; exit 0; fi
          cd worker && npx --yes wrangler@4 deploy
